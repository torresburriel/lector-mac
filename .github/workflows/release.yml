name: Publicar versión

# Se lanza a mano desde la pestaña Actions (botón "Run workflow")
# o automáticamente al subir una etiqueta tipo v1.2.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (p. ej. 1.1.0)"
        required: true
        default: "1.1.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Versión
        id: v
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Instalar dependencias
        run: npm ci

      - name: Empaquetar (Apple Silicon e Intel)
        run: node build.js arm64,x64

      - name: Firmar ad hoc y comprimir
        run: |
          V="${{ steps.v.outputs.version }}"
          curl -sSL -o rc.tgz https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz
          tar xzf rc.tgz
          RC=$(find . -name rcodesign -type f | head -1)
          for a in arm64 x64; do
            "$RC" sign "dist/Lector-darwin-$a/Lector.app"
            (cd "dist/Lector-darwin-$a" && zip -qry -9 "../Lector-$V-mac-$a.zip" Lector.app)
          done
          ls -la dist/*.zip

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          gh release create "v$V" dist/Lector-$V-mac-*.zip \
            --title "Lector $V" \
            --notes "- **Lector-$V-mac-arm64.zip**: Apple Silicon (M1 o posterior)
          - **Lector-$V-mac-x64.zip**: Intel

          Descomprime y arrastra Lector.app a Aplicaciones." \
            || gh release upload "v$V" dist/Lector-$V-mac-*.zip --clobber
