<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Lector · sin conexión</title>
<style>
  :root { --bg:#fff; --fg:#222; --muted:#666; --line:#ddd; --cta:#dd4b2f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1f1f1f; --fg:#eee; --muted:#9a9a9a; --line:#3a3a3a; } }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font:13px/1.5 Arial, Helvetica, sans-serif; display:grid; place-items:center; }
  .box { max-width:360px; border:1px solid var(--line); padding:24px; text-align:center; }
  h1 { font-size:15px; margin:0 0 6px; }
  p { color:var(--muted); margin:0 0 16px; }
  code { font-size:11px; color:var(--muted); display:block; margin-top:12px; word-break:break-all; }
  button { background:var(--cta); color:#fff; border:0; border-radius:2px; padding:8px 18px; font-weight:bold; cursor:pointer; }
</style>
</head>
<body>
  <div class="box">
    <h1>No se ha podido cargar Lector</h1>
    <p>Comprueba la conexión a internet. Se reintentará solo cuando vuelva la red.</p>
    <button id="retry">Reintentar</button>
    <code id="err"></code>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  const btn = document.getElementById("retry");
  btn.dataset.url = q.get("url") || "";
  document.getElementById("err").textContent = q.get("err") || "";
  window.addEventListener("online", () => btn.click());
</script>
</body>
</html>
